<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSYCHE AI — Architecture & Workflow Diagram Generator</title>
  <!-- Google Fonts, Mermaid JS, & SVG Pan Zoom -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #0A192F;
      --bg-card: rgba(17, 34, 64, 0.75);
      --accent-blue: #00D4FF;
      --accent-cyan: #64FFDA;
      --accent-violet: #7C3AED;
      --text-main: #E6F1FF;
      --text-sub: #8892B0;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 212, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(124, 58, 237, 0.08) 0%, transparent 40%);
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 25, 47, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }

    .brand span { color: var(--accent-blue); }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      user-select: none;
    }

    .btn:hover {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--accent-blue);
      color: white;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
      border: none;
      color: white;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .editor-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
      height: 100%;
    }

    .panel-header {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-cyan);
    }

    textarea {
      flex: 1;
      width: 100%;
      background: rgba(10, 25, 47, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: #A5F3FC;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent-blue);
    }

    .diagram-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
      backdrop-filter: blur(12px);
      height: 100%;
      overflow: hidden;
    }

    .zoom-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(10, 25, 47, 0.8);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 10px;
    }

    .zoom-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent-cyan);
      min-width: 45px;
      text-align: center;
    }

    .viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      cursor: grab;
      border-radius: 12px;
      background: rgba(10, 25, 47, 0.5);
      border: 1px dashed rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewport:active {
      cursor: grabbing;
    }

    #diagram-wrapper {
      transform-origin: center center;
      transition: transform 0.1s ease-out;
      display: inline-block;
      padding: 40px;
    }

    #diagram-target svg {
      max-width: none !important;
      height: auto !important;
      min-width: 800px;
    }

    .error-toast {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #EF4444;
      color: #FCA5A5;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.83rem;
      margin-top: 10px;
      display: none;
    }

    /* Fullscreen Mode */
    .fullscreen main {
      grid-template-columns: 1fr;
    }
    .fullscreen .editor-panel {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6v6l4 2"/></svg>
      </div>
      <div>PSYCHE <span>AI Workflow Diagram Generator</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="reset-btn">Reset Default</button>
      <button class="btn" id="copy-btn">Copy Code</button>
      <button class="btn btn-primary" id="render-btn">Render</button>
    </div>
  </header>

  <main id="main-container">
    <!-- Left: Code Editor -->
    <div class="editor-panel">
      <div class="panel-header">
        <h3>Mermaid Code Editor</h3>
        <span style="font-size:0.75rem; color:var(--text-sub);">Real-time Sync</span>
      </div>
      <textarea id="mermaid-code" spellcheck="false"></textarea>
      <div class="error-toast" id="error-toast"></div>
    </div>

    <!-- Right: Diagram Visualizer with Pan & Zoom -->
    <div class="diagram-panel">
      <div class="panel-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <h3>Interactive Workflow Canvas</h3>
          <span style="font-size:0.75rem; color:var(--text-sub);">Drag to Pan • Scroll to Zoom</span>
        </div>
        <div class="zoom-toolbar">
          <button class="btn" id="zoom-out-btn" title="Zoom Out (Scroll Down)">🔍 -</button>
          <span class="zoom-badge" id="zoom-val">100%</span>
          <button class="btn" id="zoom-in-btn" title="Zoom In (Scroll Up)">🔍 +</button>
          <button class="btn" id="zoom-reset-btn" title="Reset View">🔄 Reset</button>
          <button class="btn" id="toggle-fs-btn" title="Toggle Fullscreen Canvas">⛶ Expand</button>
        </div>
      </div>

      <div class="viewport" id="viewport">
        <div id="diagram-wrapper">
          <div id="diagram-target"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const DEFAULT_WORKFLOW = `flowchart TD
    %% PSYCHE AI System Architecture & Workflow Diagram

    subgraph USER_LAYER ["👤 User & Authentication Layer"]
        A["Student Login / Auth"] --> B{"Assessment Choice"}
        B -- Start New --> C["PSS-10 & Workload Questionnaire"]
        B -- Open Chat --> D["Interactive AI Chat View"]
    end

    subgraph ASSESSMENT_ENGINE ["📊 Stress Score & Classifier"]
        C --> E["Compute PSS Score (0–40)"]
        E --> F{"Classify Severity Level"}
        F -- "0–13" --> G1["Low Stress"]
        F -- "14–20" --> G2["Moderate Stress"]
        F -- "21–26" --> G3["High Stress"]
        F -- "27–40" --> G4["Severe Stress"]
    end

    subgraph ESCALATION ["🚨 Guidance Counselor Alert"]
        G4 --> H["Trigger Urgent Alert System"]
        H --> I["Update Supabase assessments table"]
        I --> J["Counselor Dashboard Flag"]
    end

    subgraph RECS_GEN ["💡 AI Recommendation Engine"]
        E --> K["Format Prompt (Score + Workload JSON)"]
        K --> L["Groq API (Llama-3.3-70b)"]
        L --> M["Parse JSON Array"]
        M --> N["Display Personalized Action Cards"]
    end

    subgraph CHAT_ENGINE ["💬 Groq Chat & Emotion Analysis"]
        D --> O["Load Session History (localStorage/Supabase)"]
        O --> P["User Message (Text / STT Mic Input)"]
        P --> Q["Real-Time Emotion Classifier"]
        Q --> R["Update UI Emotion Badge"]
        P --> S["Inject Context (Name, PSS Score, Grade)"]
        S --> T["Groq API (Conversational Assistant)"]
        T --> U{"Check API Status"}
        U -- "HTTP 429" --> V["Start 60s Rate-Limit Countdown"]
        U -- "Success" --> W["Append AI Response & Auto-TTS"]
        W --> X["Save Message to Session History"]
    end

    classDef primary fill:#112240,stroke:#00D4FF,stroke-width:2px,color:#fff;
    classDef warning fill:#2A1B0E,stroke:#F59E0B,stroke-width:2px,color:#fff;
    classDef danger fill:#2D1517,stroke:#EF4444,stroke-width:2px,color:#fff;
    classDef success fill:#0D2818,stroke:#10B981,stroke-width:2px,color:#fff;

    class USER_LAYER,CHAT_ENGINE primary;
    class G1,G2 success;
    class G3 warning;
    class G4,H,I,J danger;`;

    // Initialize Mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      themeVariables: {
        darkMode: true,
        background: 'transparent',
        primaryColor: '#112240',
        primaryBorderColor: '#00D4FF',
        primaryTextColor: '#E6F1FF',
        lineColor: '#64FFDA',
        fontFamily: 'Inter, sans-serif'
      }
    });

    const codeInput = document.getElementById('mermaid-code');
    const targetDiv = document.getElementById('diagram-target');
    const wrapper = document.getElementById('diagram-wrapper');
    const viewport = document.getElementById('viewport');
    const errorToast = document.getElementById('error-toast');
    const zoomVal = document.getElementById('zoom-val');

    codeInput.value = DEFAULT_WORKFLOW;

    // Pan & Zoom State
    let scale = 1.2;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isDragging = false;

    function updateTransform() {
      wrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      zoomVal.textContent = Math.round(scale * 100) + '%';
    }

    function zoom(deltaScale) {
      const newScale = Math.min(Math.max(0.3, scale + deltaScale), 4.0);
      scale = newScale;
      updateTransform();
    }

    function resetView() {
      scale = 1.2;
      pointX = 0;
      pointY = 0;
      updateTransform();
    }

    // Mouse Pan Events
    viewport.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Mouse Wheel Zoom
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 0.15 : -0.15;
      zoom(zoomFactor);
    }, { passive: false });

    // Toolbar Zoom Buttons
    document.getElementById('zoom-in-btn').addEventListener('click', () => zoom(0.25));
    document.getElementById('zoom-out-btn').addEventListener('click', () => zoom(-0.25));
    document.getElementById('zoom-reset-btn').addEventListener('click', resetView);

    // Fullscreen Toggle
    document.getElementById('toggle-fs-btn').addEventListener('click', () => {
      document.body.classList.toggle('fullscreen');
      const isFs = document.body.classList.contains('fullscreen');
      document.getElementById('toggle-fs-btn').textContent = isFs ? '🗗 Collapse' : '⛶ Expand';
    });

    async function renderDiagram() {
      const code = codeInput.value.trim();
      errorToast.style.display = 'none';

      try {
        targetDiv.innerHTML = '';
        const { svg } = await mermaid.render('mermaid-svg-render', code);
        targetDiv.innerHTML = svg;
        resetView();
      } catch (err) {
        errorToast.style.display = 'block';
        errorToast.textContent = 'Syntax Error: ' + err.message;
      }
    }

    let timeoutId = null;
    codeInput.addEventListener('input', () => {
      clearTimeout(timeoutId);
      timeoutId = setTimeout(renderDiagram, 400);
    });

    document.getElementById('render-btn').addEventListener('click', renderDiagram);

    document.getElementById('reset-btn').addEventListener('click', () => {
      codeInput.value = DEFAULT_WORKFLOW;
      renderDiagram();
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(codeInput.value);
      alert('Mermaid workflow code copied to clipboard!');
    });

    // Initial render
    window.addEventListener('DOMContentLoaded', renderDiagram);
  </script>

</body>
</html>
