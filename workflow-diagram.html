<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSYCHE AI — Mobile-Responsive Diagram Generator</title>
  <!-- Google Fonts & Mermaid JS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #0A192F;
      --bg-card: rgba(17, 34, 64, 0.75);
      --accent-blue: #00D4FF;
      --accent-cyan: #64FFDA;
      --accent-violet: #7C3AED;
      --text-main: #E6F1FF;
      --text-sub: #8892B0;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 212, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(124, 58, 237, 0.08) 0%, transparent 40%);
    }

    header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 25, 47, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
      flex-shrink: 0;
    }

    .brand span { color: var(--accent-blue); }

    .actions { display: flex; gap: 6px; flex-wrap: nowrap; }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
      user-select: none;
      white-space: nowrap;
      min-height: 34px;
    }

    .btn:hover, .btn:active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--accent-blue);
      color: white;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
      border: none;
      color: white;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(0, 212, 255, 0.25);
    }

    .mobile-tab-bar {
      display: none;
      background: rgba(10, 25, 47, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      gap: 8px;
    }

    .mobile-tab-bar .tab-btn {
      flex: 1;
      padding: 7px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-sub);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .mobile-tab-bar .tab-btn.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--accent-blue);
      color: var(--accent-cyan);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 55px);
      overflow: hidden;
    }

    .editor-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
      height: 100%;
    }

    .panel-header {
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .panel-header h3 {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent-cyan);
    }

    textarea {
      flex: 1;
      width: 100%;
      background: rgba(10, 25, 47, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      color: #A5F3FC;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.78rem;
      line-height: 1.4;
      outline: none;
      resize: none;
    }

    textarea:focus {
      border-color: var(--accent-blue);
    }

    .diagram-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      position: relative;
      backdrop-filter: blur(12px);
      height: 100%;
      overflow: hidden;
    }

    .zoom-toolbar {
      display: flex;
      gap: 4px;
      align-items: center;
      background: rgba(10, 25, 47, 0.85);
      border: 1px solid var(--border);
      padding: 3px 6px;
      border-radius: 8px;
    }

    .zoom-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-cyan);
      min-width: 40px;
      text-align: center;
    }

    .viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      cursor: grab;
      border-radius: 10px;
      background: rgba(10, 25, 47, 0.5);
      border: 1px dashed rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .viewport:active {
      cursor: grabbing;
    }

    #diagram-wrapper {
      transform-origin: center center;
      transition: transform 0.05s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* Clean Auto-Fit & Dynamic Text Alignment Styling */
    #diagram-target {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #diagram-target svg {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
    }

    #diagram-target .node rect,
    #diagram-target .node circle,
    #diagram-target .node polygon,
    #diagram-target .node path {
      stroke-width: 2px !important;
      rx: 8px !important;
      ry: 8px !important;
    }

    #diagram-target foreignObject div {
      white-space: nowrap !important; /* Keep labels clean & horizontal */
      word-wrap: normal !important;
      text-align: center !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      line-height: 1.3 !important;
      display: inline-block !important;
      padding: 6px 14px !important;
    }

    .error-toast {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #EF4444;
      color: #FCA5A5;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      margin-top: 8px;
      display: none;
    }

    @media (max-width: 768px) {
      body { overflow: auto; }
      header { padding: 8px 12px; }
      .brand-title { display: none; }
      .mobile-tab-bar { display: flex; }

      main {
        display: block;
        height: calc(100vh - 95px);
        padding: 6px;
      }

      .editor-panel, .diagram-panel {
        height: 100%;
        border-radius: 8px;
      }

      .mobile-hide { display: none !important; }

      #diagram-target foreignObject div {
        font-size: 11px !important;
        padding: 4px 8px !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6v6l4 2"/></svg>
      </div>
      <div class="brand-title">PSYCHE <span>AI Workflow</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="fit-btn" title="Fit to Screen">📐 Fit</button>
      <button class="btn" id="reset-btn">Reset</button>
      <button class="btn" id="copy-btn">Copy</button>
      <button class="btn btn-primary" id="render-btn">Render</button>
    </div>
  </header>

  <!-- Mobile Mode Switcher Bar -->
  <div class="mobile-tab-bar">
    <button class="tab-btn active" id="tab-canvas-btn">🎨 View Diagram</button>
    <button class="tab-btn" id="tab-editor-btn">📝 Edit Code</button>
  </div>

  <main id="main-container">
    <!-- Left: Code Editor -->
    <div class="editor-panel mobile-hide" id="editor-panel">
      <div class="panel-header">
        <h3>Mermaid Code Editor</h3>
        <span style="font-size:0.72rem; color:var(--text-sub);">Auto Sync</span>
      </div>
      <textarea id="mermaid-code" spellcheck="false"></textarea>
      <div class="error-toast" id="error-toast"></div>
    </div>

    <!-- Right: Diagram Visualizer with Touch & Auto-Fit -->
    <div class="diagram-panel" id="diagram-panel">
      <div class="panel-header">
        <div style="display:flex; align-items:center; gap:6px;">
          <h3>Workflow Canvas</h3>
        </div>
        <div class="zoom-toolbar">
          <button class="btn" id="zoom-out-btn" title="Zoom Out">🔍 -</button>
          <span class="zoom-badge" id="zoom-val">100%</span>
          <button class="btn" id="zoom-in-btn" title="Zoom In">🔍 +</button>
          <button class="btn" id="zoom-reset-btn" title="Reset View">🔄 Reset</button>
        </div>
      </div>

      <div class="viewport" id="viewport">
        <div id="diagram-wrapper">
          <div id="diagram-target"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Clean, natural horizontal labels without line wrapping bugs
    const DEFAULT_WORKFLOW = `flowchart TD
    %% PSYCHE AI System Architecture & Workflow Diagram

    subgraph USER_LAYER ["👤 User Layer"]
        A["Student Auth Session"] --> B{"Action Choice"}
        B -- New Assessment --> C["PSS-10 & Workload Form"]
        B -- Open Chat --> D["Interactive AI Companion"]
    end

    subgraph ASSESSMENT_ENGINE ["📊 Stress Classifier"]
        C --> E["Compute PSS Score (0–40)"]
        E --> F{"Classify Stress Severity"}
        F -- "0–13" --> G1["Low Stress"]
        F -- "14–20" --> G2["Moderate Stress"]
        F -- "21–26" --> G3["High Stress"]
        F -- "27–40" --> G4["Severe Stress"]
    end

    subgraph ESCALATION ["🚨 Counselor Alert"]
        G4 --> H["Trigger Urgent Counselor Alert"]
        H --> I["Update Supabase Record"]
        I --> J["Flag Profile on Counselor Dashboard"]
    end

    subgraph RECS_GEN ["💡 AI Recommendations"]
        E --> K["Format System Prompt (Score + Workload)"]
        K --> L["Groq API Request (GPT-OSS 120B)"]
        L --> M["Parse JSON Recommendations"]
        M --> N["Display 3 Wellness Cards"]
    end

    subgraph CHAT_ENGINE ["💬 Groq Chat Engine"]
        D --> O["Load Session History"]
        O --> P["User Input (Text or Voice STT)"]
        P --> Q["Real-Time Emotion Classifier"]
        Q --> R["Update UI Emotion Badge"]
        P --> S["Inject System Context (Name, PSS Score)"]
        S --> T["Groq API Call (LLM Assistant)"]
        T --> U{"API Status Check"}
        U -- "HTTP 429" --> V["60s Visible Rate Countdown"]
        U -- "Success" --> W["Append AI Reply & Auto-TTS"]
        W --> X["Save Pair to Session History"]
    end

    classDef primary fill:#112240,stroke:#00D4FF,stroke-width:2px,color:#fff;
    classDef warning fill:#2A1B0E,stroke:#F59E0B,stroke-width:2px,color:#fff;
    classDef danger fill:#2D1517,stroke:#EF4444,stroke-width:2px,color:#fff;
    classDef success fill:#0D2818,stroke:#10B981,stroke-width:2px,color:#fff;

    class USER_LAYER,CHAT_ENGINE primary;
    class G1,G2 success;
    class G3 warning;
    class G4,H,I,J danger;`;

    // Initialize Mermaid with Responsive Max-Width Auto-Fit enabled
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      flowchart: {
        htmlLabels: true,
        useMaxWidth: true, // Scales SVG perfectly to fit phone container
        nodeSpacing: 35,
        rankSpacing: 45,
        padding: 14
      },
      themeVariables: {
        darkMode: true,
        background: 'transparent',
        primaryColor: '#112240',
        primaryBorderColor: '#00D4FF',
        primaryTextColor: '#E6F1FF',
        lineColor: '#64FFDA',
        fontFamily: 'Inter, sans-serif'
      }
    });

    const codeInput = document.getElementById('mermaid-code');
    const targetDiv = document.getElementById('diagram-target');
    const wrapper = document.getElementById('diagram-wrapper');
    const viewport = document.getElementById('viewport');
    const errorToast = document.getElementById('error-toast');
    const zoomVal = document.getElementById('zoom-val');

    codeInput.value = DEFAULT_WORKFLOW;

    // Pan & Zoom State
    let scale = 1.0;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isDragging = false;

    let touchStartDist = 0;
    let initialScale = 1;

    function updateTransform() {
      wrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      zoomVal.textContent = Math.round(scale * 100) + '%';
    }

    function zoom(deltaScale) {
      const newScale = Math.min(Math.max(0.2, scale + deltaScale), 3.0);
      scale = newScale;
      updateTransform();
    }

    function fitToScreen() {
      scale = 1.0;
      pointX = 0;
      pointY = 0;
      updateTransform();
    }

    // --- Mouse Events ---
    viewport.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 0.1 : -0.1;
      zoom(zoomFactor);
    }, { passive: false });

    // --- Touch Events ---
    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      }
    }, { passive: true });

    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2 && touchStartDist > 0) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / touchStartDist;
        scale = Math.min(Math.max(0.2, initialScale * factor), 3.0);
        updateTransform();
      }
    }, { passive: true });

    viewport.addEventListener('touchend', () => {
      isDragging = false;
      touchStartDist = 0;
    });

    // Toolbar Controls
    document.getElementById('zoom-in-btn').addEventListener('click', () => zoom(0.2));
    document.getElementById('zoom-out-btn').addEventListener('click', () => zoom(-0.2));
    document.getElementById('zoom-reset-btn').addEventListener('click', fitToScreen);
    document.getElementById('fit-btn').addEventListener('click', fitToScreen);

    // Mobile Switcher Tabs
    const tabCanvasBtn = document.getElementById('tab-canvas-btn');
    const tabEditorBtn = document.getElementById('tab-editor-btn');
    const editorPanel  = document.getElementById('editor-panel');
    const diagramPanel = document.getElementById('diagram-panel');

    if (tabCanvasBtn && tabEditorBtn) {
      tabCanvasBtn.addEventListener('click', () => {
        tabCanvasBtn.classList.add('active');
        tabEditorBtn.classList.remove('active');
        diagramPanel.classList.remove('mobile-hide');
        editorPanel.classList.add('mobile-hide');
        fitToScreen();
      });

      tabEditorBtn.addEventListener('click', () => {
        tabEditorBtn.classList.add('active');
        tabCanvasBtn.classList.remove('active');
        editorPanel.classList.remove('mobile-hide');
        diagramPanel.classList.add('mobile-hide');
      });
    }

    async function renderDiagram() {
      const code = codeInput.value.trim();
      errorToast.style.display = 'none';

      try {
        targetDiv.innerHTML = '';
        const { svg } = await mermaid.render('mermaid-svg-render', code);
        targetDiv.innerHTML = svg;
        fitToScreen();
      } catch (err) {
        errorToast.style.display = 'block';
        errorToast.textContent = 'Syntax Error: ' + err.message;
      }
    }

    let timeoutId = null;
    codeInput.addEventListener('input', () => {
      clearTimeout(timeoutId);
      timeoutId = setTimeout(renderDiagram, 400);
    });

    document.getElementById('render-btn').addEventListener('click', renderDiagram);

    document.getElementById('reset-btn').addEventListener('click', () => {
      codeInput.value = DEFAULT_WORKFLOW;
      renderDiagram();
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(codeInput.value);
      alert('Mermaid code copied to clipboard!');
    });

    window.addEventListener('DOMContentLoaded', renderDiagram);
    window.addEventListener('resize', fitToScreen);
  </script>

</body>
</html>
